services:
  cbzxl:
    build: .
    image: cbzxl:local
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      SOURCE_DIR: ${SOURCE_DIR:-/library/source}
      DB_PATH: /config/cbzxl.sqlite3
      SCRATCH_DIR: /work
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    volumes:
      - ${LIBRARY_ROOT:-./library}:/library
      - ${CONFIG_DIR:-./data}:/config
      - ${WORK_DIR:-./work}:/work
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cpus: ${CPU_LIMIT:-2}
    mem_limit: ${CONTAINER_MEMORY:-3g}
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  migrate:
    profiles: [migration]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: cbzxl-migrate:local
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      SOURCE_DIR: ${SOURCE_DIR:-/library/source}
      DB_PATH: /config/cbzxl.sqlite3
    volumes:
      - ${LIBRARY_ROOT:-./library}:/library:ro
      - ${CONFIG_DIR:-./data}:/config
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
