name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - run: docker build --target test -t cbzxl-test:ci .
      - run: docker run --rm --network none --memory 3g --cpus 2 cbzxl-test:ci
      - run: docker build -t cbzxl:ci .
      - run: docker build -f Dockerfile.migrate -t cbzxl-migrate:ci .
      - run: node test/app-container.ts cbzxl:ci
      - run: node test/migration-container.ts cbzxl-migrate:ci
      - run: cp .env.example .env && docker compose config --quiet
